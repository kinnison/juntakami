[package]
name = "pulldown-cmark-ast"
version = "0.1.0"
edition = "2021"

[features]
default = ["generate", "fold"]
generate = ["dep:pulldown-cmark-to-cmark"]
fold = []

[dependencies]
pulldown-cmark = { version = "0.13.0", default-features = false }
pulldown-cmark-to-cmark = { git = "https://github.com/kinnison/pulldown-cmark-to-cmark", version = "21.1.0", default-features = false, optional = true }

[dev-dependencies]
insta = "1.41.1"
